name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Sources registry
        run: node tests/sources.test.mjs
      - name: Cosmology
        run: node tests/cosmology.test.mjs